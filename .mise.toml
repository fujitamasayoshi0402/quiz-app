# 開発ツールのバージョン固定
# ローカルと CI で同じバージョンを使うため、パッチバージョンまで明示する。
# 使い方: mise install（初回）/ ディレクトリに入ると自動で切り替わる
[tools]
java = "temurin-21.0.12+101.0.LTS"
node = "22.23.3"
pnpm = "12.5.1"
terraform = "1.16.3"
gitleaks = "8.30.1"
# 依存とコンテナイメージの脆弱性を調べる（DEV-113。trivy.yaml）
trivy = "0.74.0"
lefthook = "2.1.14"
# API のスモークテスト（tests/api）を流す。Postman のコレクションをそのまま実行できる
"npm:newman" = "6.2.2"
# 負荷試験（tests/load）を流す（DEV-112）
k6 = "2.3.0"
