components:
  schemas:
    AnswerRequest:
      type: object
      properties:
        choiceId:
          type: string
          format: uuid
        quizId:
          type: string
          format: uuid
      required:
      - choiceId
      - quizId
    AnswerResult:
      type: object
      properties:
        answeredCount:
          type: integer
          format: int32
        correctChoiceId:
          type: string
          format: uuid
        explanation:
          type: string
        isCorrect:
          type: boolean
        totalCount:
          type: integer
          format: int32
      required:
      - answeredCount
      - correctChoiceId
      - explanation
      - isCorrect
      - totalCount
    AttemptResult:
      type: object
      properties:
        answeredCount:
          type: integer
          format: int32
        correctCount:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        results:
          type: array
          items:
            $ref: "#/components/schemas/QuizResult"
        status:
          type: string
        totalCount:
          type: integer
          format: int32
      required:
      - answeredCount
      - correctCount
      - id
      - results
      - status
      - totalCount
    AttemptView:
      type: object
      properties:
        answeredQuizIds:
          type: array
          items:
            type: string
            format: uuid
        excludedCount:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        quizzes:
          type: array
          items:
            $ref: "#/components/schemas/DeliveredQuiz"
        scope:
          type: string
        status:
          type: string
      required:
      - answeredQuizIds
      - excludedCount
      - id
      - quizzes
      - scope
      - status
    CategoryResponse:
      type: object
      properties:
        description:
          type:
          - string
          - "null"
        id:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
      required:
      - id
      - name
      - sortOrder
    ChoiceRequest:
      type: object
      properties:
        body:
          type: string
          maxLength: 500
          minLength: 0
        isCorrect:
          type: boolean
      required:
      - body
    ChoiceResponse:
      type: object
      properties:
        body:
          type: string
        id:
          type: string
          format: uuid
        isCorrect:
          type: boolean
      required:
      - body
      - id
      - isCorrect
    CreateCategoryRequest:
      type: object
      properties:
        description:
          type:
          - string
          - "null"
          maxLength: 500
          minLength: 0
        name:
          type: string
          maxLength: 100
          minLength: 0
        sortOrder:
          type: integer
          format: int32
      required:
      - name
    CreateFigureRequest:
      type: object
      properties:
        source:
          type: string
          description: draw.io の原本（`<mxfile>` の XML）。1 MB まで
        svg:
          type: string
          description: 書き出した SVG。ルートが SVG の名前空間の `svg` 要素であること。1 MB まで
      required:
      - source
      - svg
    DeletedItem:
      type: object
      properties:
        categoryName:
          type:
          - string
          - "null"
        deletedAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        restorable:
          type: boolean
      required:
      - deletedAt
      - id
      - name
      - restorable
    DeletionImpact:
      type: object
      properties:
        difficultyCount:
          type: integer
          format: int32
        quizCount:
          type: integer
          format: int32
    DeliveredChoice:
      type: object
      properties:
        body:
          type: string
        id:
          type: string
          format: uuid
      required:
      - body
      - id
    DeliveredQuiz:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        choices:
          type: array
          items:
            $ref: "#/components/schemas/DeliveredChoice"
        difficultyId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        question:
          type: string
      required:
      - categoryId
      - choices
      - difficultyId
      - id
      - question
    DifficultyResponse:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        description:
          type:
          - string
          - "null"
        id:
          type: string
          format: uuid
        level:
          type: integer
          format: int32
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
      required:
      - categoryId
      - id
      - level
      - name
      - sortOrder
    FigureResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    FigureSourceResponse:
      type: object
      properties:
        source:
          type: string
          description: draw.io の原本。描き直すときに draw.io へ読み込ませる
      required:
      - source
    ImportQuizRequest:
      type: object
      properties:
        category:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChoiceRequest"
        difficulty:
          type: string
        explanation:
          type: string
        question:
          type: string
        status:
          type: string
      required:
      - category
      - difficulty
      - question
    ImportQuizzesRequest:
      type: object
      properties:
        quizzes:
          type: array
          items:
            $ref: "#/components/schemas/ImportQuizRequest"
          maxItems: 500
          minItems: 1
      required:
      - quizzes
    ImportQuizzesResponse:
      type: object
      properties:
        importedCount:
          type: integer
          format: int32
      required:
      - importedCount
    MyTenantResponse:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        slug:
          type: string
      required:
      - name
      - role
      - slug
    PlayableCategoryResponse:
      type: object
      properties:
        description:
          type:
          - string
          - "null"
        difficulties:
          type: array
          items:
            $ref: "#/components/schemas/PlayableDifficultyResponse"
        id:
          type: string
          format: uuid
        name:
          type: string
        quizCount:
          type: integer
          format: int32
      required:
      - difficulties
      - id
      - name
      - quizCount
    PlayableDifficultyResponse:
      type: object
      properties:
        description:
          type:
          - string
          - "null"
        id:
          type: string
          format: uuid
        level:
          type: integer
          format: int32
        name:
          type: string
        quizCount:
          type: integer
          format: int32
      required:
      - id
      - level
      - name
      - quizCount
    ProblemDetail:
      type: object
      additionalProperties: true
      description: RFC 9457 の Problem Details 形式のエラー応答
      properties:
        detail:
          type: string
          description: この発生に固有の説明
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
          description: HTTP ステータスコード
        title:
          type: string
          description: エラーの種類を表す短い説明
        type:
          type: string
          format: uri
    QuizResponse:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        choices:
