        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 挑戦を終えて結果を取得
      tags:
      - 挑戦
  /api/t/{slug}/play/categories:
    get:
      operationId: listPlayableCategories
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
