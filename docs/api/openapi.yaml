          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 解説図の原本（draw.io）を取得
      tags:
      - 解説図
    parameters:
    - description: テナントの識別子（URL 用の短い名前）
      in: path
      name: slug
      required: true
      schema:
        type: string
  /api/t/{slug}/admin/quizzes:
    get:
      operationId: searchQuizzes
      parameters:
      - in: query
        name: categoryId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: difficultyId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
