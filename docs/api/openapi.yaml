openapi: 3.1.0
info:
  description: |-
    カテゴリと難易度を自由に定義できるクイズアプリの API。

    テナント配下のエンドポイントは、触れる人によってパスが分かれる。

    - `/api/t/{slug}/admin/...` … 管理者として所属していること
    - `/api/t/{slug}/play/...` … 所属していること

    同じクイズでも管理 API は正解を含み、出題 API は含まない。
  title: quiz-app API
  version: 0.1.0
servers:
- description: アプリケーションと同じオリジン
  url: /
security:
- stubUser: []
tags:
- description: カテゴリ配下の難易度を CRUD する。体系はカテゴリごとに決める
  name: 難易度
- description: 出題・回答・結果。**出題の応答に正解と解説を含まない**
  name: 挑戦
- description: 公開済みのクイズがあるカテゴリと難易度
  name: 出題条件
- description: 管理者がクイズを CRUD する。**応答に正解を含む**
  name: クイズ（管理）
- description: 管理者がカテゴリを CRUD する
  name: カテゴリ
- description: 論理削除したカテゴリ・難易度・クイズの一覧と復活
  name: 削除済み
paths:
  /api/t/{slug}/admin/categories:
    get:
      operationId: listCategories
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: カテゴリ一覧
      tags:
      - カテゴリ
    post:
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: カテゴリを作成
      tags:
      - カテゴリ
  /api/t/{slug}/admin/categories/{categoryId}/difficulties:
    get:
      operationId: listDifficulties
      parameters:
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DifficultyResponse"
          description: OK
        "401":
          content:
            application/problem+json:
