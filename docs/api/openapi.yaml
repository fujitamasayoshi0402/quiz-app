      - クイズ（管理）
  /api/t/{slug}/admin/quizzes/import:
    parameters:
    - description: テナントの識別子（URL 用の短い名前）
      in: path
      name: slug
      required: true
      schema:
        type: string
    post:
      description: 1 件でも取り込めない行があれば、1 件も取り込まずに 400 を返す。理由は `rows` に行ごとに入る
      operationId: importQuizzes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportQuizzesRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportQuizzesResponse"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: クイズをまとめて取り込む
      tags:
      - クイズ（管理）
  /api/t/{slug}/admin/quizzes/{id}:
    delete:
      operationId: deleteQuiz
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
