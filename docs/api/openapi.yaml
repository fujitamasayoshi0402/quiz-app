openapi: 3.1.0
info:
  description: |-
    カテゴリと難易度を自由に定義できるクイズアプリの API。

    テナント配下のエンドポイントは、触れる人によってパスが分かれる。

    - `/api/t/{slug}/admin/...` … 管理者として所属していること
    - `/api/t/{slug}/play/...` … 所属していること

    同じクイズでも管理 API は正解を含み、出題 API は含まない。
  title: quiz-app API
  version: 0.1.0
servers:
- description: アプリケーションと同じオリジン
  url: /
security:
- bearerAuth: []
tags:
- description: カテゴリ配下の難易度を CRUD する。体系はカテゴリごとに決める
  name: 難易度
- description: 出題・回答・結果。**出題の応答に正解と解説を含まない**
  name: 挑戦
- description: 管理者が解説図（draw.io の原本と SVG）を置く
  name: 解説図
- description: ログインしている利用者自身の情報
  name: 利用者
- description: 公開済みのクイズがあるカテゴリと難易度
  name: 出題条件
- description: 管理者がクイズを CRUD する。**応答に正解を含む**
  name: クイズ（管理）
- description: 利用者が解説図を見る
  name: 解説図（出題）
- description: 管理者がカテゴリを CRUD する
  name: カテゴリ
- description: 論理削除したカテゴリ・難易度・クイズの一覧と復活
  name: 削除済み
paths:
  /api/me/tenants:
    get:
      operationId: listMyTenants
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyTenantResponse"
          description: OK
      summary: 所属しているテナントの一覧
      tags:
      - 利用者
  /api/t/{slug}/admin/categories:
    get:
      operationId: listCategories
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: カテゴリ一覧
      tags:
      - カテゴリ
    parameters:
    - description: テナントの識別子（URL 用の短い名前）
      in: path
      name: slug
      required: true
      schema:
        type: string
    post:
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: カテゴリを作成
      tags:
      - カテゴリ
  /api/t/{slug}/admin/categories/{categoryId}/difficulties:
    get:
      operationId: listDifficulties
      parameters:
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DifficultyResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 難易度一覧
      tags:
      - 難易度
    parameters:
    - description: テナントの識別子（URL 用の短い名前）
      in: path
      name: slug
      required: true
      schema:
        type: string
    post:
      operationId: createDifficulty
      parameters:
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDifficultyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DifficultyResponse"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 難易度を作成
      tags:
      - 難易度
  /api/t/{slug}/admin/categories/{categoryId}/difficulties/{id}:
    delete:
      operationId: deleteDifficulty
      parameters:
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 難易度を削除（その難易度のクイズも削除される）
      tags:
      - 難易度
    get:
      operationId: getDifficulty
      parameters:
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DifficultyResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 難易度を 1 件取得
      tags:
      - 難易度
    parameters:
    - description: テナントの識別子（URL 用の短い名前）
      in: path
      name: slug
      required: true
      schema:
        type: string
    put:
      operationId: updateDifficulty
      parameters:
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDifficultyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DifficultyResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 難易度を更新
      tags:
      - 難易度
  /api/t/{slug}/admin/categories/{categoryId}/difficulties/{id}/deletion-impact:
    get:
      operationId: difficultyDeletionImpact
      parameters:
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionImpact"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 削除したときに巻き込む範囲
      tags:
      - 難易度
    parameters:
    - description: テナントの識別子（URL 用の短い名前）
      in: path
      name: slug
      required: true
      schema:
        type: string
  /api/t/{slug}/admin/categories/{id}:
    delete:
      operationId: deleteCategory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
