          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: カテゴリを削除（配下の難易度・クイズも削除される）
      tags:
      - カテゴリ
    get:
      operationId: getCategory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: カテゴリを 1 件取得
      tags:
      - カテゴリ
    parameters:
    - description: テナントの識別子（URL 用の短い名前）
      in: path
      name: slug
      required: true
      schema:
        type: string
    put:
      operationId: updateCategory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: カテゴリを更新
      tags:
      - カテゴリ
  /api/t/{slug}/admin/categories/{id}/deletion-impact:
    get:
      description: 削除前の確認に使う。配下に何も無くても確認を挟むため、0 件でも応答する
      operationId: categoryDeletionImpact
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionImpact"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 削除したときに巻き込む範囲
      tags:
      - カテゴリ
    parameters:
    - description: テナントの識別子（URL 用の短い名前）
      in: path
      name: slug
      required: true
      schema:
        type: string
  /api/t/{slug}/admin/figures:
    parameters:
    - description: テナントの識別子（URL 用の短い名前）
      in: path
      name: slug
      required: true
      schema:
        type: string
    post:
      description: SVG は無害化しない。配るときに、アプリと別のオリジンから、スクリプトを止めるヘッダを付けて返す
      operationId: createFigure
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFigureRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FigureResponse"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 解説図を置く
      tags:
      - 解説図
  /api/t/{slug}/admin/figures/{id}:
    delete:
      description: 論理削除ではない。発行済みの URL は期限（最長 10 分）まで使える
      operationId: deleteFigure
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 解説図を消す
      tags:
      - 解説図
    parameters:
    - description: テナントの識別子（URL 用の短い名前）
      in: path
      name: slug
      required: true
      schema:
        type: string
  /api/t/{slug}/admin/figures/{id}/source:
    get:
      operationId: getFigureSource
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FigureSourceResponse"
          description: OK
        "401":
          content:
            application/problem+json:
