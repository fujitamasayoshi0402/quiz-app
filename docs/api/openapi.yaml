          description: テナントが存在しない、または所属していない
      summary: 挑戦を再開する
      tags:
      - 挑戦
  /api/t/{slug}/play/attempts/{attemptId}/abandon:
    post:
      operationId: abandonAttempt
      parameters:
      - in: path
        name: attemptId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 挑戦を破棄する
      tags:
      - 挑戦
  /api/t/{slug}/play/attempts/{attemptId}/answers:
    post:
      operationId: answerQuiz
      parameters:
      - in: path
        name: attemptId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
