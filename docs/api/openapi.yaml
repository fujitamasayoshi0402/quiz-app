components:
  schemas:
    AnswerRequest:
      type: object
      properties:
        choiceId:
          type: string
          format: uuid
        quizId:
          type: string
          format: uuid
    AnswerResult:
      type: object
      properties:
        answeredCount:
          type: integer
          format: int32
        correctChoiceId:
          type: string
          format: uuid
        explanation:
          type: string
        isCorrect:
          type: boolean
        totalCount:
          type: integer
          format: int32
    AttemptResult:
      type: object
      properties:
        answeredCount:
          type: integer
          format: int32
        correctCount:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        results:
          type: array
          items:
            $ref: "#/components/schemas/QuizResult"
        status:
          type: string
        totalCount:
          type: integer
          format: int32
    AttemptView:
      type: object
      properties:
        answeredQuizIds:
          type: array
          items:
            type: string
            format: uuid
        excludedCount:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        quizzes:
          type: array
          items:
            $ref: "#/components/schemas/DeliveredQuiz"
        scope:
          type: string
        status:
          type: string
    CategoryResponse:
      type: object
      properties:
        description:
          type:
          - string
          - "null"
        id:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
    ChoiceRequest:
      type: object
      properties:
        body:
          type: string
          maxLength: 500
          minLength: 0
        isCorrect:
          type: boolean
      required:
      - body
    ChoiceResponse:
      type: object
      properties:
        body:
          type: string
        id:
          type: string
          format: uuid
        isCorrect:
          type: boolean
    CreateCategoryRequest:
      type: object
      properties:
        description:
          type:
          - string
          - "null"
          maxLength: 500
          minLength: 0
        name:
          type: string
          maxLength: 100
          minLength: 0
        sortOrder:
          type: integer
          format: int32
      required:
      - name
    DeletedItem:
      type: object
      properties:
        categoryName:
          type:
          - string
          - "null"
        deletedAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        restorable:
          type: boolean
    DeletionImpact:
      type: object
      properties:
        difficultyCount:
          type: integer
          format: int32
        quizCount:
          type: integer
          format: int32
    DeliveredChoice:
      type: object
      properties:
        body:
          type: string
        id:
          type: string
          format: uuid
    DeliveredQuiz:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        choices:
          type: array
          items:
            $ref: "#/components/schemas/DeliveredChoice"
        difficultyId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        question:
          type: string
    DifficultyResponse:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        description:
          type:
          - string
          - "null"
        id:
          type: string
          format: uuid
        level:
          type: integer
          format: int32
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
    PlayableCategoryResponse:
      type: object
      properties:
        description:
          type:
          - string
          - "null"
        difficulties:
          type: array
          items:
            $ref: "#/components/schemas/PlayableDifficultyResponse"
        id:
          type: string
          format: uuid
        name:
          type: string
        quizCount:
          type: integer
          format: int32
    PlayableDifficultyResponse:
      type: object
      properties:
        description:
          type:
          - string
          - "null"
        id:
          type: string
          format: uuid
        level:
          type: integer
          format: int32
        name:
          type: string
        quizCount:
          type: integer
          format: int32
    ProblemDetail:
      type: object
      additionalProperties: true
      description: RFC 9457 の Problem Details 形式のエラー応答
      properties:
        detail:
          type: string
          description: この発生に固有の説明
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
          description: HTTP ステータスコード
        title:
          type: string
          description: エラーの種類を表す短い説明
        type:
          type: string
          format: uri
    QuizResponse:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChoiceResponse"
        difficultyId:
          type: string
          format: uuid
        explanation:
          type: string
        id:
          type: string
          format: uuid
        question:
          type: string
        status:
          type: string
    QuizResult:
      type: object
      properties:
        choices:
          type: array
          items:
            $ref: "#/components/schemas/DeliveredChoice"
        correctChoiceId:
          type: string
          format: uuid
        explanation:
          type: string
        isCorrect:
          type: boolean
        question:
          type: string
        quizId:
          type: string
          format: uuid
        selectedChoiceId:
          type:
          - string
          - "null"
          format: uuid
    SaveDifficultyRequest:
      type: object
      properties:
        description:
          type:
          - string
          - "null"
          maxLength: 500
          minLength: 0
        level:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
          maxLength: 50
          minLength: 0
        sortOrder:
          type: integer
          format: int32
      required:
      - name
    SaveQuizRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChoiceRequest"
        difficultyId:
          type: string
          format: uuid
        explanation:
          type: string
        question:
          type: string
          maxLength: 2000
          minLength: 0
        status:
          type: string
      required:
      - question
    StartAttemptRequest:
      type: object
      properties:
        categoryId:
          type:
          - string
          - "null"
          format: uuid
        difficultyId:
          type:
          - string
          - "null"
          format: uuid
        discardInProgress:
          type: boolean
        level:
          type:
          - integer
          - "null"
          format: int32
          minimum: 1
        limit:
          type:
          - integer
          - "null"
          format: int32
          maximum: 100
          minimum: 1
        order:
          type: string
        scope:
          type: string
    Trash:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/DeletedItem"
        difficulties:
          type: array
          items:
            $ref: "#/components/schemas/DeletedItem"
        quizzes:
          type: array
          items:
            $ref: "#/components/schemas/DeletedItem"
    UpdateCategoryRequest:
      type: object
      properties:
        description:
          type:
          - string
          - "null"
          maxLength: 500
          minLength: 0
        name:
          type: string
          maxLength: 100
          minLength: 0
        sortOrder:
          type: integer
          format: int32
      required:
      - name
  securitySchemes:
    stubUser:
      description: Phase 1 のスタブ認証。利用者の UUID をそのまま渡す。Phase 3 で Cognito の JWT に差し替える
      in: header
      name: X-User-Id
      type: apiKey
