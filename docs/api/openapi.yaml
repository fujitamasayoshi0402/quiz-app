          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 難易度を 1 件取得
      tags:
      - 難易度
    put:
      operationId: updateDifficulty
      parameters:
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: id
