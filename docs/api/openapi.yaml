      operationId: getCurrentAttempt
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptView"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 中断中の挑戦を取得
      tags:
      - 挑戦
  /api/t/{slug}/play/attempts/{attemptId}:
    get:
      operationId: resumeAttempt
      parameters:
      - in: path
        name: attemptId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptView"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 利用者を特定できない
        "403":
          content:
