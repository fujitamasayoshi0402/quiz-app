        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 難易度一覧
      tags:
      - 難易度
    post:
      operationId: createDifficulty
      parameters:
      - in: path
