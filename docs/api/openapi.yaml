        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: 所属はしているが、この操作に必要な権限がない
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: テナントが存在しない、または所属していない
      summary: 1 問に回答する
      tags:
      - 挑戦
  /api/t/{slug}/play/attempts/{attemptId}/complete:
    post:
      operationId: completeAttempt
      parameters:
      - in: path
        name: attemptId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
