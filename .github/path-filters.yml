# 変更されたパスから、何に影響するかを決める（dorny/paths-filter の filters）。2 か所から読む。
#
#   ci.yml の changes         … PR と push で、どのジョブを流すかを決める。直前のコミットとの差を見る
#   deploy-dev.yml の deploy  … dev に何を載せるかを決める。dev でいま動いているもののコミットとの差を見る（DEV-79）
#
# 同じ一覧を使い、「CI が見るもの」と「デプロイが載せるもの」を揃える。migration はデプロイだけが使う
#
# backend は quiz-service、notification は notification-service（Lambda）。片方だけを変えたときに、もう片方を載せ直さない
backend:
  - 'services/quiz-service/**'
  # quiz-service のイメージのビルドが読む。壊れていると、イメージが作れない
  - 'services/notification-service/build.gradle.kts'
  # サービスの間で共有する型（ADR-0022）。quiz-service のイメージにも入る
  - 'libs/**'
  - 'build.gradle.kts'
  - '.dockerignore'
  - 'config/detekt.yml'
  - '.editorconfig'
  - 'gradle/**'
  - 'gradlew'
  - 'settings.gradle.kts'
  - '.mise.toml'
  - '.github/path-filters.yml'
  - '.github/workflows/ci.yml'
  - '.github/scripts/coverage-summary.py'
  - '.github/workflows/deploy-dev.yml'
  - '.github/scripts/deployed-commits.sh'
  - '.github/scripts/deploy-quiz-service.sh'
  - '.github/scripts/smoke-token.sh'
notification:
  - 'services/notification-service/**'
  - 'libs/**'
  # テストが、ルールの絞り込みを Terraform と同じ JSON で確かめる（EventPatternTest）
  - 'infra/terraform/modules/notification-service/event-pattern.json'
  - 'build.gradle.kts'
  - 'config/detekt.yml'
  - '.editorconfig'
  - 'gradle/**'
  - 'gradlew'
  - 'settings.gradle.kts'
  - '.mise.toml'
  - '.github/path-filters.yml'
  - '.github/workflows/ci.yml'
  - '.github/workflows/deploy-dev.yml'
  - '.github/scripts/deployed-commits.sh'
  - '.github/scripts/deploy-notification-service.sh'
frontend:
  - 'apps/**'
  - '.dockerignore'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  # Amplify のビルドの手順。変えたら dev の web をビルドし直す
  - 'amplify.yml'
  # 型は OpenAPI 定義から生成するため、定義が変われば作り直しが要る
  - 'docs/api/**'
  - '.mise.toml'
  - '.github/path-filters.yml'
  - '.github/workflows/ci.yml'
  - '.github/workflows/deploy-dev.yml'
  - '.github/scripts/deployed-commits.sh'
  - '.github/scripts/build-web.sh'
  - '.github/scripts/smoke-token.sh'
# デプロイで、マイグレーションの単発タスクを流すか（DEV-88）。DB に流れるもの（マイグレーションとシード）と、Flyway の設定。
# ここにないものだけが変わったデプロイでは、流しても何もしないため飛ばす。どれも backend に含まれる
migration:
  - 'services/quiz-service/src/main/resources/db/**'
  - 'services/quiz-service/src/main/resources/application.yml'
  - 'services/quiz-service/src/main/resources/application-dev.yml'
  - 'services/quiz-service/src/main/resources/application-migrate.yml'
terraform:
  - 'infra/terraform/**'
  - '.mise.toml'
  - '.github/path-filters.yml'
  - '.github/workflows/ci.yml'
# バックエンドか画面が変わったときにも流す（e2e ジョブの条件）。ここはそれ以外で E2E に関わるもの
e2e:
  - 'tests/e2e/**'
  - 'docker-compose.yml'
  - 'infra/docker/**'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '.github/path-filters.yml'
  - '.github/workflows/ci.yml'
