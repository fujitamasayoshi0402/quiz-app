name: deploy-dev

# develop に入ったものを dev に載せる。ci.yml が、develop への push でチェックが通ったあとに呼ぶ。
# Actions の画面から手で流すこともできる（Terraform でタスク定義の形を変えたあとなど）。
#
# **何を載せるかは、dev でいま動いているものと比べて決める**（DEV-79）。quiz-service と web のそれぞれで、
# 動いているもののコミットから develop の先頭までに、関わるパス（.github/path-filters.yml）が変わっていれば載せる。
# 直前の push との差で決めると、続けてマージして待ちの実行が取り消されたとき、その分が載らない。
#
# quiz-service を載せるとき、**マイグレーションも同じ差で流すかを決める**（DEV-88）。動いているもののコミットから、
# DB に流れるもの（path-filters.yml の migration）が変わっていなければ、単発タスクを飛ばす。
# 動いているもののコミットまでは、流し終わっている。サービスは、マイグレーションが成功してからしか替わらないため。
#
# どちらも GitHub の Environment dev で動く。dev は develop からしか使えず、
# AWS のロールも、この Environment のジョブにしか引き受けさせない（modules/deploy-role）
# 入力の backend と frontend は auto（動いているものと比べる）/ deploy（必ず載せる）/ skip（載せない）。
# Terraform でタスク定義の形を変えたあとは、コミットが同じでも載せ直すため deploy を指定する。
# migration は auto（動いているものと比べる）/ run（必ず流す）。**飛ばす指定は持たない。** DB に流れるものを変えたコミットを、
# 流さずに載せると、それが動いているものになり、以後は差がないとして流れなくなる
on:
  workflow_call:
    inputs:
      backend:
        description: quiz-service をデプロイするか（auto / deploy / skip）
        type: string
        default: auto
      frontend:
        description: web（Amplify）をビルドし直すか（auto / deploy / skip）
        type: string
        default: auto
      migration:
        description: quiz-service を載せるとき、マイグレーションを流すか（auto / run）
        type: string
        default: auto
  workflow_dispatch:
    inputs:
      backend:
        description: quiz-service をデプロイするか
        type: choice
        options: [auto, deploy, skip]
        default: auto
      frontend:
        description: web（Amplify）をビルドし直すか
        type: choice
        options: [auto, deploy, skip]
        default: auto
      migration:
        description: quiz-service を載せるとき、マイグレーションを流すか
        type: choice
        options: [auto, run]
        default: auto

permissions:
  contents: read
  # OIDC のトークンを取り、AWS のロールを引き受ける。アクセスキーは使わない
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: quiz-app-dev/quiz-service
  ECS_CLUSTER: quiz-app-dev
  ECS_SERVICE: quiz-service
  MIGRATE_FAMILY: quiz-app-dev-quiz-service-migrate
  AMPLIFY_BRANCH: develop

jobs:
  deploy:
    name: deploy
    # ECS のタスクは arm64（Graviton）。エミュレーションを挟まずにイメージを作る
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment:
      name: dev
      # 独自ドメインではなく Amplify の既定のドメインを載せる。どちらもベーシック認証がかかる
      url: https://${{ env.AMPLIFY_BRANCH }}.${{ vars.AMPLIFY_APP_ID }}.amplifyapp.com
    # 後から始まったデプロイは、先のデプロイが終わるまで待つ。追い越すと、古いコミットが後から載りうる。
    # 動いているものは止めない。マイグレーションの途中で止めると、どこまで流れたかが分からなくなる
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      # 動いているもののコミットとの差を取るため、履歴をすべて取る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # リポジトリは Public で、ログも誰でも読める。イメージの URL などに含まれるアカウント ID を伏せる
          mask-aws-account-id: true

      - name: dev で動いているものを調べる
        id: deployed
        run: .github/scripts/deployed-commits.sh "$ECS_CLUSTER" "$ECS_SERVICE" "$AMPLIFY_APP_ID" "$AMPLIFY_BRANCH" | tee -a "$GITHUB_OUTPUT"
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}

      # 調べられなかったとき（空）は差を取らず、載せるものとして扱う。
      # backend が deploy のときも調べる。コミットが同じまま載せ直すとき（タスク定義の形を変えたあと）に、マイグレーションを飛ばすため
      - name: quiz-service に関わる変更を探す
        id: backend-changes
        if: inputs.backend != 'skip' && steps.deployed.outputs.backend != ''
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.deployed.outputs.backend }}
          filters: .github/path-filters.yml

      - name: web に関わる変更を探す
        id: frontend-changes
        if: inputs.frontend == 'auto' && steps.deployed.outputs.web != ''
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.deployed.outputs.web }}
          filters: .github/path-filters.yml

      - name: 載せるものを決める
        id: plan
        run: |
          # $1: 指定（auto / deploy / skip）、$2: 動いているもののコミット、$3: 差があるか（調べていなければ空）
          decide() {
            case "$1" in
              deploy) echo true; return ;;
              skip) echo false; return ;;
            esac
            # 動いているほうが新しければ載せない。古い実行をやり直したときに、新しいものを古いもので上書きしない
            if [[ -n "$2" && "$2" != "$GITHUB_SHA" ]] && git merge-base --is-ancestor "$GITHUB_SHA" "$2"; then
              echo false; return
            fi
            [[ "$3" == "false" ]] && echo false || echo true
          }
          BACKEND=$(decide "$BACKEND_MODE" "$BACKEND_DEPLOYED" "$BACKEND_CHANGED")
          FRONTEND=$(decide "$FRONTEND_MODE" "$WEB_DEPLOYED" "$FRONTEND_CHANGED")
          # マイグレーションは、差がないと分かったときだけ飛ばす。動いているものが不明で差を調べていなければ（空）流す
          if [[ "$MIGRATION_MODE" != "run" && "$MIGRATION_CHANGED" == "false" ]]; then MIGRATION=skip; else MIGRATION=run; fi
          {
            echo "backend=$BACKEND"
            echo "frontend=$FRONTEND"
            echo "migration=$MIGRATION"
          } >> "$GITHUB_OUTPUT"
          {
            echo "- 載せるコミット: ${GITHUB_SHA::12}"
            echo "- quiz-service: 動いているもの ${BACKEND_DEPLOYED:0:12}（不明なら空）→ 載せる: ${BACKEND}"
            if [[ "$BACKEND" == "true" ]]; then echo "  - マイグレーション: ${MIGRATION}"; fi
            echo "- web: 動いているもの ${WEB_DEPLOYED:0:12}（不明なら空）→ 載せる: ${FRONTEND}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          BACKEND_MODE: ${{ inputs.backend }}
          FRONTEND_MODE: ${{ inputs.frontend }}
          MIGRATION_MODE: ${{ inputs.migration }}
          BACKEND_DEPLOYED: ${{ steps.deployed.outputs.backend }}
          WEB_DEPLOYED: ${{ steps.deployed.outputs.web }}
          BACKEND_CHANGED: ${{ steps.backend-changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.frontend-changes.outputs.frontend }}
          MIGRATION_CHANGED: ${{ steps.backend-changes.outputs.migration }}

      - name: イメージを作って ECR に push する
        if: steps.plan.outputs.backend == 'true'
        run: |
          TAG="${GITHUB_SHA::12}"
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "IMAGE=${REGISTRY}/${ECR_REPOSITORY}:${TAG}" >> "$GITHUB_ENV"

          # タグは上書きできない。再実行で、同じコミットのイメージがすでにあれば作り直さない
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=${TAG}" > /dev/null 2>&1; then
            echo "作成済みのイメージを使います: ${TAG}"
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -f services/quiz-service/Dockerfile -t "${REGISTRY}/${ECR_REPOSITORY}:${TAG}" .
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${TAG}"

      # マイグレーションが失敗したら、サービスは替えずにここで止まる
      - name: quiz-service をデプロイする
        if: steps.plan.outputs.backend == 'true'
        run: .github/scripts/deploy-quiz-service.sh "$ECS_CLUSTER" "$ECS_SERVICE" "$MIGRATE_FAMILY" "$IMAGE" "$MIGRATION"
        env:
          MIGRATION: ${{ steps.plan.outputs.migration }}

      # quiz-service の後に流す。新しい画面が古い API を呼ばないように
      - name: web をビルドする
        if: steps.plan.outputs.frontend == 'true'
        run: .github/scripts/build-web.sh "$AMPLIFY_APP_ID" "$AMPLIFY_BRANCH" "$GITHUB_SHA"
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        if: steps.plan.outputs.backend == 'true' || steps.plan.outputs.frontend == 'true'
        with:
          install_args: node npm:newman

      # web → API → DB がつながっているかを、画面と同じ経路（Amplify と proxy）で確かめる。
      # スモークテストの利用者（Terraform の modules/auth が作る）でトークンを取り、Authorization に付けて呼ぶ。
      # 失敗するとワークフローが失敗し、GitHub から通知が届く。何も載せなかったときは流さない
      - name: スモークテスト
        if: steps.plan.outputs.backend == 'true' || steps.plan.outputs.frontend == 'true'
        run: |
          TOKEN=$(.github/scripts/smoke-token.sh "$AUTH_CLIENT_ID" "$SMOKE_USER_EMAIL")
          echo "::add-mask::$TOKEN"
          newman run tests/api/quiz-app.postman_collection.json \
            --env-var "baseUrl=https://${AMPLIFY_BRANCH}.${AMPLIFY_APP_ID}.amplifyapp.com" \
            --env-var "accessToken=${TOKEN}"
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AUTH_CLIENT_ID: ${{ vars.AUTH_CLIENT_ID }}
          AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
          SMOKE_USER_EMAIL: smoke@example.com
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
