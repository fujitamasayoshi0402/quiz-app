name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 同じブランチに新しく push されたら、動いている古い実行を止める。
# Testcontainers を使うジョブは実行時間が長く、積み上がると待ち時間になる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 変更されたパスを見て、後続のジョブを出し分ける。
  # monorepo なので、フロントだけの変更でバックエンドのテストまで回す必要はない
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/**'
              - '.dockerignore'
              - 'config/detekt.yml'
              - '.editorconfig'
              - 'gradle/**'
              - 'gradlew'
              - 'settings.gradle.kts'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/scripts/coverage-summary.py'
            frontend:
              - 'apps/**'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              # 型は OpenAPI 定義から生成するため、定義が変われば作り直しが要る
              - 'docs/api/**'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infra/terraform/**'
              - '.mise.toml'
              - '.github/workflows/ci.yml'

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ツールのバージョンは .mise.toml が持つ。CI 側で別に指定すると二重管理になる
      - uses: jdx/mise-action@v2

      - uses: gradle/actions/setup-gradle@v4

      - name: lint（ktlint / detekt）
        run: ./gradlew :services:quiz-service:ktlintCheck :services:quiz-service:detekt

      # Testcontainers が PostgreSQL を起動する。ランナーには Docker が入っている
      - name: test
        run: ./gradlew :services:quiz-service:test

      # 閾値では落とさない。数値はジョブのサマリーに出して、PR ごとの目安にする
      - name: カバレッジを集計する
        run: >-
          python3 .github/scripts/coverage-summary.py
          services/quiz-service/build/reports/jacoco/test/jacocoTestReport.xml >> "$GITHUB_STEP_SUMMARY"

      - name: カバレッジのレポートを保存する
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/quiz-service/build/reports/jacoco/test/html/
          retention-days: 7

      - name: build
        run: ./gradlew :services:quiz-service:bootJar

      # Dockerfile が壊れていても、使うまで気づかない。Phase 2 のデプロイで初めて落ちないようにする
      - name: コンテナイメージをビルドする
        run: docker build -f services/quiz-service/Dockerfile .

      # 失敗したときだけ残す。OpenAPI の乖離やテストの詳細はレポートを見ないと分からない
      - name: レポートを保存する
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: services/quiz-service/build/reports/
          retention-days: 7

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: pnpm ストアの場所を調べる
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      # 生成物をリポジトリに持っているので、作り直して差が出ないことを確かめる。
      # ここが落ちるのは「API を変えたのにクライアントを作り直していない」とき。
      # 操作が増えるとファイルも増えるため、変更だけでなく追加・削除も見る
      - name: API クライアントが OpenAPI 定義から作り直されているか
        run: |
          pnpm --filter web generate:api
          if [ -n "$(git status --porcelain -- apps/web/src/lib/api/generated)" ]; then
            echo "::error::生成したクライアントが docs/api/openapi.yaml と合っていません。pnpm --filter web generate:api を実行してコミットしてください"
            git status --short -- apps/web/src/lib/api/generated
            exit 1
          fi

      - name: 型チェック
        run: pnpm --filter web typecheck

      - name: lint
        run: pnpm --filter web lint

      # 型チェックと lint では、Server / Client Components の境界の誤りやビルド設定の問題が分からない
      - name: ビルド
        run: pnpm --filter web build

      - name: コンテナイメージをビルドする
        run: docker build -f apps/web/Dockerfile .

  # AWS には触れない。plan / apply は OIDC のロールができるまでローカルから行う
  terraform:
    name: terraform
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    env:
      # AWS provider は大きい。ルートモジュールごとに取り直さないよう、ジョブの中で使い回す
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: terraform

      - name: 整形（terraform fmt）
        run: terraform fmt -check -recursive -diff infra/terraform

      # backend は初期化しない。認証なしで、構文・型・参照の誤りだけを見る
      - name: 検証（terraform validate）
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in infra/terraform/bootstrap infra/terraform/account infra/terraform/envs/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # パスの出し分けの対象外にして、常に走らせる。secret はどのファイルにも入りうる。
  # pre-commit のフックは入れ忘れや --no-verify ですり抜けるため、ここで止める
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 途中のコミットで入れて後のコミットで消しても、履歴には残っている。履歴ごと見る
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          install_args: gitleaks

      # 見るのは HEAD から辿れる履歴だけ。ほかのブランチの検出で、無関係な PR まで落ちないようにする。
      # リポジトリは Public で、ログも誰でも読める。見つけた値は伏せる
      - name: secret を探す（gitleaks）
        run: gitleaks git --log-opts=HEAD --redact --no-banner --verbose

  # 必須ステータスチェックはこのジョブだけを指定する（DEV-16）。
  # ジョブを足すたびに Ruleset を触らずに済み、パスの出し分けでスキップされても
  # 「報告されないまま待ち続ける」状態にならない
  ci:
    name: ci
    if: always()
    needs: [changes, backend, frontend, terraform, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: 先行ジョブの結果を確かめる
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::先行ジョブが失敗またはキャンセルされました"
          exit 1

      - run: echo "すべてのチェックを通過しました"
