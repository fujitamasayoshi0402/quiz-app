# 開発プロファイル。**本番相当の環境では読み込まない。**
spring:
  flyway:
    # スキーマのマイグレーションに加えて、デモ用のシードを流す。効くのは migrate と合わせたとき（dev,migrate）。
    # 既定（application.yml）は db/migration のみで、シードはここでしか加わらない。
    # 誤って本番で dev を有効にした場合は SeedDataGuard が起動を止める。
    # スモークテストのテナント（db/smoke）と、デモのテナントの土台（db/demo）も入れる。
    # prod は smoke と demo のプロファイルで、この 2 つだけを入れる（application-smoke.yml、application-demo.yml）
    locations: classpath:db/migration,classpath:db/seed,classpath:db/smoke,classpath:db/demo
