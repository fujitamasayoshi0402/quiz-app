# Amplify Hosting のビルド設定（ADR-0012）。web だけをビルドして配る。
# アプリとブランチは Terraform（infra/terraform/modules/web）が作る。自動ビルドは止めてあり、起動は手動か CI から行う。
#
# 値に `: ` を含むコマンドは、引用符で囲まないと YAML として読めない。
version: 1
applications:
  - appRoot: apps/web
    frontend:
      # pnpm の workspace と lockfile はリポジトリのルートにある。コマンドはルートで流す
      buildPath: /
      phases:
        preBuild:
          commands:
            # バージョンは .mise.toml（Node）と package.json の packageManager（pnpm）に揃える。
            # ビルドイメージの既定のグローバルパッケージ（Amplify CLI や Cypress など）は使わないので入れない。入れると 1 分ほどかかる
            - nvm install --skip-default-packages 22.23.2
            - nvm use 22.23.2
            - corepack enable
            # Amplify は、pnpm の既定の配置（シンボリックリンク）の node_modules から next を見つけられない。
            # ビルドの中でだけ hoisted にする。コマンドの引数で渡すと、pnpm --filter の前の検査で既定の配置に戻される。
            # リポジトリの設定は変えない。ローカルでは、宣言していない依存を読めない既定の配置のままにしておく
            - 'printf "\nnodeLinker: hoisted\n" >> pnpm-workspace.yaml'
            - COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm install --frozen-lockfile
        build:
          commands:
            # SSR の実行時には、Amplify の環境変数が渡らない。サーバー側で読む値だけを .env.production に書き出す。
            # NEXT_PUBLIC_ を付けないので、ブラウザ向けのコードには入らない。AUTH_* はログイン（ADR-0016）
            - env | grep -E '^(API_ORIGIN|ORIGIN_VERIFY_SECRET|AUTH_[A-Z_]+)=' >> apps/web/.env.production
            - pnpm --filter web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - apps/web/.next/cache/**/*
